server {
    listen 8080;
    server_name 127.0.0.1 localhost;
    server_tokens off;
    client_max_body_size 1m;

    # Protección básica del navegador desde el inicio. TLS y cuotas llegarán después.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'; form-action 'self'" always;

    location / {
        # Docker resuelve el nombre del servicio. La resolución dinámica también
        # permite recuperar el proxy si Compose recrea la aplicación con otra IP.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $aplicacion http://app:8000;
        proxy_pass $aplicacion;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
