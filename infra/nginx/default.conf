server {
    listen 8080;
    server_name 127.0.0.1 localhost;
    server_tokens off;
    # Ningún formulario, documento o POST se atiende por HTTP.
    return 308 https://127.0.0.1:8443$request_uri;
}

server {
    listen 8443 ssl;
    server_name 127.0.0.1 localhost;
    server_tokens off;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    client_max_body_size 1m;

    # Cabeceras del portal; las cuotas corresponden a la etapa 5.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Conserva Origin en formularios del mismo sitio para su validación CSRF.
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'; form-action 'self'" always;

    location / {
        # Docker resuelve el nombre del servicio. La resolución dinámica también
        # permite recuperar el proxy si Compose recrea la aplicación con otra IP.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $aplicacion http://app:8000;
        proxy_pass $aplicacion;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
