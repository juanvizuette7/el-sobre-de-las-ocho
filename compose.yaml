name: el-sobre-de-las-ocho

services:
  app:
    image: el-sobre-de-las-ocho-app:etapa1
    build:
      context: .
      target: runtime
    # EXPOSE en Dockerfile documenta el puerto; no lo publica en Windows.
    networks: [portal]
    read_only: true
    tmpfs: [/tmp]
    environment:
      PORTAL_ORIGIN: https://127.0.0.1:8443
    volumes:
      - identidad:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:stable-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    user: "101:101"
    # El comando directo evita que el entrypoint intente modificar los montajes.
    entrypoint: [nginx]
    command: [-g, "daemon off;"]
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/nginx:/etc/nginx/tls:ro
      - ./certs/ca/ca.crt:/etc/nginx/ca.crt:ro
    # La red de entrada permite publicar el proxy en Docker Desktop.
    # FastAPI permanece únicamente en la red interna portal.
    networks: [entrada, portal]
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.5
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --cacert, /etc/nginx/ca.crt, "https://127.0.0.1:8443/health"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 5s

networks:
  entrada:
    driver: bridge
  portal:
    internal: true

volumes:
  identidad:
